name: Workshop compatibility

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-workshop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r tests/requirements.txt
      - run: npm ci --ignore-scripts
      - name: Download, test and build the Workshop package
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'pz-steamcmd'
          $output = Join-Path $env:RUNNER_TEMP 'workshop-output'
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          python -B -m scripts.build_workshop --steamcmd (Join-Path $dir 'steamcmd.exe') --check-upstream --output $output
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-package
          path: ${{ runner.temp }}/workshop-output/
          if-no-files-found: error
